name: Build Debug APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps && npm run build && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
```[cite: 4, 5]

### Next Steps
1. Select all text in the editor on your screen (`Ctrl + A`), paste the YAML above (`Ctrl + V`), and click the green **Commit changes...** button in the top-right corner[cite: 5].
2. Go to the **Actions** tab, click **Build Debug APK**, and click **Run workflow**[cite: 3, 5].
3. Once the run finishes with a green checkmark, scroll down to **Artifacts** and download **`app-debug`** to get your `.apk` file.
